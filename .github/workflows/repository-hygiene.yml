name: Repository Hygiene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-ignored-files:
    name: Reject tracked ignored files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify repository tracking hygiene
        run: scripts/check-tracked-ignored.sh

      - name: Verify backend dependency direction
        run: python3 apps/lingzhi/scripts/audit_backend_dependencies.py

      - name: Verify release routing
        run: python3 -m unittest discover -s scripts/tests -v
