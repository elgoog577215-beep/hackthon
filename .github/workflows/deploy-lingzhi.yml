name: Verify Lingzhi Release Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingzhi-release-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify repository tracking hygiene
        run: scripts/check-tracked-ignored.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release artifact on runner
        env:
          LINGZHI_TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          scripts/build-deploy-artifact.sh "/tmp/lingzhi-release-${GITHUB_SHA}.tgz"

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingzhi-release-${{ github.sha }}
          path: /tmp/lingzhi-release-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 7
