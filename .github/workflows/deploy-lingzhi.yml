name: Deploy Lingzhi

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingzhi-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify repository tracking hygiene
        run: scripts/check-tracked-ignored.sh

      - name: Verify DeepSeek primary provider
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            https://api.deepseek.com/models \
            | python3 -c 'import json, sys; payload = json.load(sys.stdin); available = {str(item.get("id", "")) for item in payload.get("data", []) if isinstance(item, dict)}; required = {"deepseek-v4-pro", "deepseek-v4-flash"}; missing = sorted(required - available); missing and sys.exit("DeepSeek account is missing required models: " + ", ".join(missing))'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release artifact on runner
        env:
          LINGZHI_TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          scripts/build-deploy-artifact.sh "/tmp/lingzhi-release-${GITHUB_SHA}.tgz"

      - name: Configure deployment SSH
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          LINGZHI_SSH_KEY: ${{ secrets.LINGZHI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINGZHI_SSH_HOST"
          test -n "$LINGZHI_SSH_USER"
          test -n "$LINGZHI_SSH_KEY"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$LINGZHI_SSH_KEY" > ~/.ssh/lingzhi_deploy
          chmod 600 ~/.ssh/lingzhi_deploy
          ssh-keyscan -H "$LINGZHI_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Configure production AI providers
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_SMART_MODELS: deepseek-v4-pro,deepseek-v4-flash
          DEEPSEEK_FAST_MODELS: deepseek-v4-flash,deepseek-v4-pro
          AI_ASSESSMENT_GENERATOR_MODELS: deepseek-v4-pro,deepseek-v4-flash
          AI_ASSESSMENT_SOLVER_MODELS: deepseek-v4-flash,deepseek-v4-pro
          AI_ASSESSMENT_REVIEWER_MODELS: deepseek-v4-pro,deepseek-v4-flash
          AI_PPT_STORY_MODELS: deepseek-v4-pro,deepseek-v4-flash
          AI_PPT_VISUAL_MODELS: deepseek-v4-flash,deepseek-v4-pro
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          MODELSCOPE_BASE_URL: https://api-inference.modelscope.cn/v1/
          MODELSCOPE_MODEL: Qwen/Qwen3.5-27B
          SLIDE_DECK_V6_ENABLED: true
          SLIDE_DECK_V6_DEFAULT_ENABLED: true
        run: |
          set -euo pipefail
          test -n "$DEEPSEEK_API_KEY"
          test "$DEEPSEEK_BASE_URL" = "https://api.deepseek.com"
          test -n "$DEEPSEEK_SMART_MODELS"
          test -n "$DEEPSEEK_FAST_MODELS"
          test -n "$AI_ASSESSMENT_GENERATOR_MODELS"
          test -n "$AI_ASSESSMENT_SOLVER_MODELS"
          test -n "$AI_ASSESSMENT_REVIEWER_MODELS"
          test -n "$MODELSCOPE_API_KEY"
          test -n "$AI_PPT_STORY_MODELS"
          test -n "$AI_PPT_VISUAL_MODELS"
          test "$SLIDE_DECK_V6_ENABLED" = "true"
          test "$SLIDE_DECK_V6_DEFAULT_ENABLED" = "true"

          remote_script="$(ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "mktemp /tmp/lingzhi-configure-ai.XXXXXX.py")"
          cleanup_remote_script() {
            ssh \
              -i ~/.ssh/lingzhi_deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
              "rm -f -- '$remote_script'" || true
          }
          trap cleanup_remote_script EXIT

          scp \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            scripts/configure_modelscope_fallback.py \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST:$remote_script"
          python3 -c 'import json, os; print(json.dumps({"primary_api_key": os.environ["DEEPSEEK_API_KEY"], "primary_base_url": os.environ["DEEPSEEK_BASE_URL"], "smart_models": os.environ["DEEPSEEK_SMART_MODELS"], "fast_models": os.environ["DEEPSEEK_FAST_MODELS"], "assessment_generator_models": os.environ["AI_ASSESSMENT_GENERATOR_MODELS"], "assessment_solver_models": os.environ["AI_ASSESSMENT_SOLVER_MODELS"], "assessment_reviewer_models": os.environ["AI_ASSESSMENT_REVIEWER_MODELS"], "ppt_story_models": os.environ["AI_PPT_STORY_MODELS"], "ppt_visual_models": os.environ["AI_PPT_VISUAL_MODELS"], "fallback_api_key": os.environ["MODELSCOPE_API_KEY"], "fallback_base_url": os.environ["MODELSCOPE_BASE_URL"], "fallback_model": os.environ["MODELSCOPE_MODEL"], "slide_deck_v6_enabled": os.environ["SLIDE_DECK_V6_ENABLED"], "slide_deck_v6_default_enabled": os.environ["SLIDE_DECK_V6_DEFAULT_ENABLED"]}))' | ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "python3 '$remote_script'"

          cleanup_remote_script
          trap - EXIT

      - name: Upload release artifact
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          remote_artifact="/opt/lingzhi/incoming/lingzhi-release-${GITHUB_SHA}.tgz"
          ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "install -d -m 700 /opt/lingzhi/incoming"
          scp \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "/tmp/lingzhi-release-${GITHUB_SHA}.tgz" \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST:$remote_artifact"

      - name: Activate release on server
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          local_artifact="/tmp/lingzhi-release-${GITHUB_SHA}.tgz"
          remote_artifact="/opt/lingzhi/incoming/lingzhi-release-${GITHUB_SHA}.tgz"
          artifact_sha256="$(sha256sum "$local_artifact" | awk '{print $1}')"
          ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "LINGZHI_TARGET_COMMIT='$GITHUB_SHA' LINGZHI_ARTIFACT_PATH='$remote_artifact' LINGZHI_ARTIFACT_SHA256='$artifact_sha256' bash -s" \
            < scripts/github-action-deploy.sh
