name: Deploy Lingzhi

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation to run
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - compact
          - inspect
          - recover

permissions:
  contents: read

concurrency:
  group: lingzhi-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify repository tracking hygiene
        run: scripts/check-tracked-ignored.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build release artifact on runner
        env:
          LINGZHI_TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          scripts/build-deploy-artifact.sh "/tmp/lingzhi-release-${GITHUB_SHA}.tgz"

      - name: Configure deployment SSH
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          LINGZHI_SSH_KEY: ${{ secrets.LINGZHI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINGZHI_SSH_HOST"
          test -n "$LINGZHI_SSH_USER"
          test -n "$LINGZHI_SSH_KEY"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$LINGZHI_SSH_KEY" > ~/.ssh/lingzhi_deploy
          chmod 600 ~/.ssh/lingzhi_deploy
          ssh-keyscan -H "$LINGZHI_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload release artifact
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          remote_artifact="/opt/lingzhi/incoming/lingzhi-release-${GITHUB_SHA}.tgz"
          ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "install -d -m 700 /opt/lingzhi/incoming"
          scp \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "/tmp/lingzhi-release-${GITHUB_SHA}.tgz" \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST:$remote_artifact"

      - name: Activate release on server
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          local_artifact="/tmp/lingzhi-release-${GITHUB_SHA}.tgz"
          remote_artifact="/opt/lingzhi/incoming/lingzhi-release-${GITHUB_SHA}.tgz"
          artifact_sha256="$(sha256sum "$local_artifact" | awk '{print $1}')"
          ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "LINGZHI_TARGET_COMMIT='$GITHUB_SHA' LINGZHI_ARTIFACT_PATH='$remote_artifact' LINGZHI_ARTIFACT_SHA256='$artifact_sha256' bash -s" \
            < scripts/github-action-deploy.sh

  recover:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (
        inputs.operation == 'compact' ||
        inputs.operation == 'inspect' ||
        inputs.operation == 'recover'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure recovery SSH
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          LINGZHI_SSH_KEY: ${{ secrets.LINGZHI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINGZHI_SSH_HOST"
          test -n "$LINGZHI_SSH_USER"
          test -n "$LINGZHI_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LINGZHI_SSH_KEY" > ~/.ssh/lingzhi_recover
          chmod 600 ~/.ssh/lingzhi_recover
          ssh-keyscan -H "$LINGZHI_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Diagnose and recover current release
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/lingzhi_recover \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "LINGZHI_OPERATION='${{ inputs.operation }}' bash -s" <<'REMOTE'
          set -u
          echo "=== host resources ==="
          uptime
          free -h
          df -h /
          ps -eo pid,ppid,comm,rss,%mem --sort=-rss | head -n 15
          echo "=== active release ==="
          readlink -f /opt/lingzhi/hackthon || true
          echo "=== persistent data sizes ==="
          find /opt/lingzhi/state/backend-data \
            -maxdepth 2 -type f -printf '%s %p\n' \
            | sort -nr \
            | head -n 25
          echo "=== service before recovery ==="
          systemctl show lingzhi \
            --property=ActiveState \
            --property=SubState \
            --property=Result \
            --property=ExecMainCode \
            --property=ExecMainStatus \
            --property=MemoryCurrent \
            --property=MemoryPeak \
            --property=MemoryHigh \
            --property=MemoryMax \
            --property=MemorySwapCurrent \
            --property=MemorySwapMax \
            --no-pager || true
          systemctl cat lingzhi || true
          journalctl -k -n 120 --no-pager \
            | grep -Ei 'oom|out of memory|killed process|memory cgroup' || true
          journalctl -u lingzhi -n 100 --no-pager || true
          if [ "$LINGZHI_OPERATION" = "inspect" ]; then
            systemctl stop lingzhi || true
            echo "INSPECTION_OK"
            exit 0
          fi
          if [ "$LINGZHI_OPERATION" = "compact" ]; then
            jobs_file="/opt/lingzhi/state/backend-data/generation_jobs.json"
            if [ -f "$jobs_file" ]; then
              jobs_size="$(stat -c '%s' "$jobs_file")"
              if [ "$jobs_size" -gt 33554432 ]; then
                archive="/opt/lingzhi/backups/generation_jobs-oversized-$(date +%Y%m%d-%H%M%S).json"
                systemctl stop lingzhi || true
                mv "$jobs_file" "$archive"
                jobs_tmp="${jobs_file}.tmp"
                printf '{}\n' > "$jobs_tmp"
                chmod 600 "$jobs_tmp"
                mv "$jobs_tmp" "$jobs_file"
                echo "ARCHIVED_OVERSIZED_JOB_INDEX=$archive"
              fi
            fi
          fi
          systemctl reset-failed lingzhi || true
          systemctl restart lingzhi
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:7862/api/health; then
              echo
              echo "RECOVERY_OK"
              exit 0
            fi
            sleep 2
          done
          echo "=== service after failed recovery ==="
          systemctl show lingzhi \
            --property=ActiveState \
            --property=SubState \
            --property=Result \
            --property=ExecMainCode \
            --property=ExecMainStatus \
            --no-pager || true
          journalctl -u lingzhi -n 160 --no-pager || true
          exit 1
          REMOTE
