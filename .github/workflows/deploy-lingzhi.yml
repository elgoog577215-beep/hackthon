name: Deploy Lingzhi to Tuotu

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish to Tuotu after verification (false builds only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tuotu: ${{ steps.targets.outputs.tuotu }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: targets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/release_targets.py --base "$BASE" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
  verify:
    needs: plan
    if: ${{ needs.plan.outputs.tuotu == 'true' }}
    uses: ./.github/workflows/lingzhi-checks.yml

  deploy:
    # Documentation-only runs never acquire the production queue. Build-only
    # runs have independent groups and cannot displace a queued real release.
    concurrency:
      group: ${{ ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[no deploy]')) || inputs.deploy) && 'lingzhi-tuotu-production' || format('lingzhi-tuotu-build-{0}', github.run_id) }}
      cancel-in-progress: false
    if: ${{ github.event_name != 'pull_request' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/lingzhi
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify repository tracking hygiene
        run: ../../scripts/check-tracked-ignored.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/lingzhi/frontend/package-lock.json

      - name: Build release artifact on runner
        env:
          LINGZHI_TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          scripts/build-deploy-artifact.sh "/tmp/lingzhi-release-${GITHUB_SHA}.tgz"

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lingzhi-release-${{ github.sha }}
          path: /tmp/lingzhi-release-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Configure deployment SSH
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[no deploy]')) || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          LINGZHI_SSH_KEY: ${{ secrets.LINGZHI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINGZHI_SSH_HOST"
          test -n "$LINGZHI_SSH_USER"
          test -n "$LINGZHI_SSH_KEY"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$LINGZHI_SSH_KEY" > ~/.ssh/lingzhi_deploy
          chmod 600 ~/.ssh/lingzhi_deploy
          ssh-keyscan -H "$LINGZHI_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify ZJU Qwen text provider
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[no deploy]')) || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
        env:
          ZJU_QWEN_API_KEY: ${{ secrets.ZJU_QWEN_API_KEY }}
          ZJU_QWEN_BASE_URL: ${{ secrets.ZJU_QWEN_BASE_URL }}
          ZJU_QWEN_MODEL: qwen3.8-27b
        run: |
          set -euo pipefail
          test -n "$ZJU_QWEN_API_KEY"
          test -n "$ZJU_QWEN_BASE_URL"
          if ! models_payload="$(curl -fsS --max-time 20 \
            -H "Authorization: Bearer $ZJU_QWEN_API_KEY" \
            "${ZJU_QWEN_BASE_URL%/}/models" 2>/dev/null)"; then
            echo "ZJU Qwen model list probe failed" >&2
            exit 1
          fi
          MODELS_PAYLOAD="$models_payload" python3 -c 'import json,os; payload=json.loads(os.environ["MODELS_PAYLOAD"]); ids={str(item.get("id") or "") for item in payload.get("data") or []}; expected=os.environ["ZJU_QWEN_MODEL"]; expected in ids or (_ for _ in ()).throw(SystemExit("required ZJU Qwen model unavailable")); print("ZJU Qwen model list verified")'
          if ! chat_payload="$(curl -fsS --max-time 45 \
            -H "Authorization: Bearer $ZJU_QWEN_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"qwen3.8-27b","messages":[{"role":"system","content":"Return only this JSON object: {\"ok\":true}"},{"role":"user","content":"probe"}],"max_tokens":64,"temperature":0,"chat_template_kwargs":{"enable_thinking":false}}' \
            "${ZJU_QWEN_BASE_URL%/}/chat/completions" 2>/dev/null)"; then
            echo "ZJU Qwen chat probe failed" >&2
            exit 1
          fi
          CHAT_PAYLOAD="$chat_payload" python3 -c 'import json,os; payload=json.loads(os.environ["CHAT_PAYLOAD"]); choice=(payload.get("choices") or [{}])[0]; content=str((choice.get("message") or {}).get("content") or ""); choice.get("finish_reason") == "stop" and "ok" in content or (_ for _ in ()).throw(SystemExit("ZJU Qwen chat probe failed")); print("ZJU Qwen chat probe verified")'

      - name: Configure production ZJU Qwen provider
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[no deploy]')) || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          ZJU_QWEN_API_KEY: ${{ secrets.ZJU_QWEN_API_KEY }}
          ZJU_QWEN_BASE_URL: ${{ secrets.ZJU_QWEN_BASE_URL }}
          ZJU_QWEN_MODEL: qwen3.8-27b
          LINGZHI_RELEASE_SHA: ${{ github.sha }}
          SLIDE_DECK_V6_ENABLED: true
          SLIDE_DECK_V6_DEFAULT_ENABLED: true
          TEACHER_SCRIPT_ANIMATION_ENABLED: false
        run: |
          set -euo pipefail
          test -n "$ZJU_QWEN_API_KEY"
          test -n "$ZJU_QWEN_BASE_URL"
          previous_release="$(ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "readlink -f /opt/lingzhi/hackthon")"
          test -n "$previous_release"
          printf 'LINGZHI_PREVIOUS_RELEASE=%s\n' "$previous_release" >> "$GITHUB_ENV"
          env_backup="$(ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "set -e; install -d -m 700 /opt/lingzhi/backups; backup=/opt/lingzhi/backups/env-${GITHUB_SHA}-$(date +%Y%m%d%H%M%S).bak; if [ -f /opt/lingzhi/state/.env ]; then install -m 600 /opt/lingzhi/state/.env \"\$backup\"; else : > \"\$backup.empty\"; fi; printf '%s' \"\$backup\"")"
          printf 'LINGZHI_ENV_BACKUP=%s\n' "$env_backup" >> "$GITHUB_ENV"
          remote_script="$(ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "mktemp /tmp/lingzhi-configure-zju-qwen.XXXXXX.py")"
          cleanup_remote_script() {
            ssh \
              -i ~/.ssh/lingzhi_deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
              "rm -f -- '$remote_script'" || true
          }
          trap cleanup_remote_script EXIT

          scp \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            scripts/configure_zju_qwen_provider.py \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST:$remote_script"
          python3 -c 'import json, os; print(json.dumps({"api_key": os.environ["ZJU_QWEN_API_KEY"], "base_url": os.environ["ZJU_QWEN_BASE_URL"], "model": os.environ["ZJU_QWEN_MODEL"], "release_sha": os.environ["LINGZHI_RELEASE_SHA"], "slide_deck_v6_enabled": os.environ["SLIDE_DECK_V6_ENABLED"], "slide_deck_v6_default_enabled": os.environ["SLIDE_DECK_V6_DEFAULT_ENABLED"], "teacher_script_animation_enabled": os.environ["TEACHER_SCRIPT_ANIMATION_ENABLED"]}))' \
            | ssh \
              -i ~/.ssh/lingzhi_deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
              "python3 '$remote_script'"

          cleanup_remote_script
          trap - EXIT

      - name: Upload release artifact
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[no deploy]')) || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          remote_artifact="/opt/lingzhi/incoming/lingzhi-release-${GITHUB_SHA}.tgz"
          ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "install -d -m 700 /opt/lingzhi/incoming"
          scp \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "/tmp/lingzhi-release-${GITHUB_SHA}.tgz" \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST:$remote_artifact"

      - name: Activate release on Tuotu server
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[no deploy]')) || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          local_artifact="/tmp/lingzhi-release-${GITHUB_SHA}.tgz"
          remote_artifact="/opt/lingzhi/incoming/lingzhi-release-${GITHUB_SHA}.tgz"
          artifact_sha256="$(sha256sum "$local_artifact" | awk '{print $1}')"
          set +e
          ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "LINGZHI_TARGET_COMMIT='$GITHUB_SHA' LINGZHI_ARTIFACT_PATH='$remote_artifact' LINGZHI_ARTIFACT_SHA256='$artifact_sha256' bash -s" \
            < scripts/github-action-deploy.sh
          deployment_status=$?
          set -e
          if [ "$deployment_status" -eq 75 ]; then
            printf 'LINGZHI_DEPLOY_BUSY=true\n' >> "$GITHUB_ENV"
          fi
          exit "$deployment_status"

      - name: Verify production ZJU Qwen routes
        if: ${{ (github.event_name == 'push' && !contains(github.event.head_commit.message, '[no deploy]')) || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "set -a; . /opt/lingzhi/state/.env; set +a; cd /opt/lingzhi/hackthon; /opt/lingzhi/.venv/bin/python scripts/probe_zju_qwen_runtime.py"

      - name: Restore previous release and model config on failure
        if: ${{ failure() && env.LINGZHI_ENV_BACKUP != '' && env.LINGZHI_DEPLOY_BUSY != 'true' }}
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "LINGZHI_PREVIOUS_RELEASE='$LINGZHI_PREVIOUS_RELEASE' LINGZHI_ENV_BACKUP='$LINGZHI_ENV_BACKUP' bash -s" \
            < scripts/github-action-restore.sh
