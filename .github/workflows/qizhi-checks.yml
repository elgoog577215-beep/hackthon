name: Qizhi Checks

on:
  push:
    paths:
      - 'qizhi/**'
      - 'scripts/qizhi.sh'
      - 'scripts/check_qizhi_layout.py'
      - '.github/workflows/qizhi-checks.yml'
  pull_request:
    paths:
      - 'qizhi/**'
      - 'scripts/qizhi.sh'
      - 'scripts/check_qizhi_layout.py'
      - '.github/workflows/qizhi-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            qizhi/client/website/package-lock.json
            qizhi/plugins/essay_check_front/package-lock.json
      - name: Verify repository and Compose
        run: |
          scripts/check-tracked-ignored.sh
          scripts/qizhi.sh check
          python -m compileall -q qizhi/server qizhi/plugins/essay_check/app
      - name: Verify deployment configuration boundaries
        run: |
          python -m pip install sqlalchemy==2.0.46 pydantic==2.12.5 python-dotenv==1.2.1
          python -m unittest discover -s qizhi/server/tests -p test_public_configuration.py
      - name: Build Qizhi website
        working-directory: qizhi/client/website
        run: npm ci && npm run build
      - name: Build essay frontend
        working-directory: qizhi/plugins/essay_check_front
        run: npm ci && npm run build
