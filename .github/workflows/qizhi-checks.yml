name: Qizhi Checks

on:
  push:
    paths:
      - 'apps/qizhi/**'
      - 'deploy/zju/**'
      - 'scripts/qizhi.sh'
      - 'scripts/check_qizhi_layout.py'
      - '.github/workflows/qizhi-checks.yml'
  pull_request:
    paths:
      - 'apps/qizhi/**'
      - 'deploy/zju/**'
      - 'scripts/qizhi.sh'
      - 'scripts/check_qizhi_layout.py'
      - '.github/workflows/qizhi-checks.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/qizhi/client/website/package-lock.json
            apps/qizhi/plugins/essay_check_front/package-lock.json
      - name: Verify repository and Compose
        run: |
          scripts/check-tracked-ignored.sh
          scripts/qizhi.sh check
          python -m compileall -q apps/qizhi/server apps/qizhi/plugins/essay_check/app
      - name: Verify deployment configuration boundaries
        run: |
          python -m pip install -r apps/qizhi/server/requirements.txt pip-audit
          python -m pip_audit -r apps/qizhi/server/requirements.txt
          python -m unittest discover -s apps/qizhi/server/tests -p test_public_configuration.py
          cd apps/qizhi/server
          python -m unittest discover -s tests -p test_analytics_contract.py
      - name: Build Qizhi website
        working-directory: apps/qizhi/client/website
        run: npm ci && npm audit --audit-level=high --registry=https://registry.npmjs.org && npm test && npm run build
      - name: Verify analytics dashboard flow
        working-directory: apps/qizhi/client/website
        run: npx playwright install --with-deps --no-shell chromium && npm run test:e2e
      - name: Build essay frontend
        working-directory: apps/qizhi/plugins/essay_check_front
        run: npm ci && npm run build
