name: Lingzhi Checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/lingzhi
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify repository tracking hygiene
        run: ../../scripts/check-tracked-ignored.sh

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            apps/lingzhi/backend/requirements.txt
            apps/lingzhi/backend/requirements-dev.txt

      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest backend/tests

      - name: Run compatibility tests
        run: python -m pytest tests

      - name: Lint backend and tests
        run: python -m ruff check backend tests --select E9,F63,F7,F82

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/lingzhi/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/lingzhi/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/lingzhi/frontend
        run: npm test

      - name: Build frontend
        working-directory: apps/lingzhi/frontend
        env:
          VITE_BASE_PATH: /lingzhi/
        run: npm run build

      - name: Validate OpenSpec contracts
        run: |
          npm install --global @fission-ai/openspec@1.12.0
          openspec validate --all --strict --no-interactive
