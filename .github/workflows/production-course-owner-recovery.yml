name: Production Course Owner Recovery

on:
  workflow_dispatch:
    inputs:
      source_course_id:
        description: "Completed course to make visible"
        required: true
        type: string
      target_course_id:
        description: "Current empty course whose owner should receive the completed course"
        required: true
        type: string
      confirmation:
        description: "Must equal transfer_owner_keep_target"
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure production SSH
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          LINGZHI_SSH_KEY: ${{ secrets.LINGZHI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINGZHI_SSH_HOST"
          test -n "$LINGZHI_SSH_USER"
          test -n "$LINGZHI_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LINGZHI_SSH_KEY" > ~/.ssh/lingzhi_recovery
          chmod 600 ~/.ssh/lingzhi_recovery
          ssh-keyscan -H "$LINGZHI_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Back up and transfer completed course ownership
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          SOURCE_COURSE_ID: ${{ inputs.source_course_id }}
          TARGET_COURSE_ID: ${{ inputs.target_course_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "transfer_owner_keep_target" ]; then
            echo "confirmation mismatch" >&2
            exit 2
          fi
          remote_source="$(printf '%q' "$SOURCE_COURSE_ID")"
          remote_target="$(printf '%q' "$TARGET_COURSE_ID")"
          ssh -i ~/.ssh/lingzhi_recovery \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "LINGZHI_RECOVERY_SOURCE=$remote_source LINGZHI_RECOVERY_TARGET=$remote_target bash -s" <<'REMOTE'
          set -euo pipefail
          state_root=/opt/lingzhi/state/backend-data
          backup_root=/opt/lingzhi/backups
          application_root=/opt/lingzhi/hackthon
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          backup_path="$backup_root/data-owner-recovery-$stamp.tgz"
          release_version="$(cat "$application_root/.release-commit")"

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import re


          root = Path("/opt/lingzhi/state/backend-data/courses")
          source_id = os.environ["LINGZHI_RECOVERY_SOURCE"].strip()
          target_id = os.environ["LINGZHI_RECOVERY_TARGET"].strip()
          safe = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]{0,159}")
          if source_id == target_id or not safe.fullmatch(source_id) or not safe.fullmatch(target_id):
              raise SystemExit("invalid recovery course ids")
          source = json.loads((root / f"{source_id}.json").read_text(encoding="utf-8"))
          target = json.loads((root / f"{target_id}.json").read_text(encoding="utf-8"))
          target_document = target.get("course_document") or {}
          source_document = source.get("course_document") or {}
          if source.get("course_name") != target.get("course_name"):
              raise SystemExit("course names differ")
          if target_document.get("sections") or target_document.get("blocks"):
              raise SystemExit("target course is not empty")
          if target.get("generation_job_id") or target.get("generation_status") != "draft":
              raise SystemExit("target course is no longer an untouched draft")
          target_brief = (target.get("generation_request") or {}).get("teacher_course_brief") or {}
          if target_brief.get("lecture_count") != 64 or target_brief.get("total_class_hours") != 128:
              raise SystemExit("target course inputs changed")
          if not target.get("owner_id"):
              raise SystemExit("target owner is missing")
          if source.get("generation_status") != "teacher_outline_ready":
              raise SystemExit("source outline is not ready")
          if source.get("outline_generation_status") != "completed":
              raise SystemExit("source outline is not complete")
          if source.get("teacher_outline_committed") is not True:
              raise SystemExit("source outline is not committed")
          if len(source_document.get("sections") or []) != 12:
              raise SystemExit("source outline section count changed")
          source_brief = (source.get("generation_request") or {}).get("teacher_course_brief") or {}
          if source_brief.get("lecture_count") != 6 or source_brief.get("total_class_hours") != 48:
              raise SystemExit("source generation inputs changed")
          print(json.dumps({
              "preflight": "passed",
              "source_course_id": source_id,
              "target_course_id": target_id,
              "source_document_revision": source_document.get("document_revision"),
              "source_section_count": len(source_document.get("sections") or []),
              "target_preserved": True,
          }, sort_keys=True))
          PY

          python3 "$application_root/scripts/create_verified_data_backup.py" create \
            --source "$state_root" \
            --output "$backup_path" \
            --release-version "$release_version"

          python3 - <<'PY'
          from __future__ import annotations

          from contextlib import ExitStack
          from copy import deepcopy
          from datetime import datetime, timezone
          import fcntl
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import tempfile


          root = Path("/opt/lingzhi/state/backend-data/courses")
          source_id = os.environ["LINGZHI_RECOVERY_SOURCE"].strip()
          target_id = os.environ["LINGZHI_RECOVERY_TARGET"].strip()
          safe = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]{0,159}")
          if source_id == target_id or not safe.fullmatch(source_id) or not safe.fullmatch(target_id):
              raise SystemExit("invalid recovery course ids")


          def digest(value: str) -> str:
              return hashlib.sha256(value.encode()).hexdigest()[:12] if value else ""


          def read(course_id: str) -> dict:
              return json.loads((root / f"{course_id}.json").read_text(encoding="utf-8"))


          def write_atomic(path: Path, value: dict) -> None:
              temporary_name = ""
              try:
                  with tempfile.NamedTemporaryFile(
                      mode="w",
                      encoding="utf-8",
                      dir=path.parent,
                      prefix=f".{path.name}.",
                      suffix=".tmp",
                      delete=False,
                  ) as handle:
                      temporary_name = handle.name
                      json.dump(value, handle, ensure_ascii=False, indent=2)
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.replace(temporary_name, path)
                  directory_fd = os.open(path.parent, os.O_RDONLY)
                  try:
                      os.fsync(directory_fd)
                  finally:
                      os.close(directory_fd)
              finally:
                  if temporary_name:
                      Path(temporary_name).unlink(missing_ok=True)


          paths = {
              source_id: root / f"{source_id}.json",
              target_id: root / f"{target_id}.json",
          }
          with ExitStack() as stack:
              for course_id in sorted(paths):
                  lock = stack.enter_context(open(paths[course_id].with_suffix(".lock"), "a+"))
                  fcntl.flock(lock.fileno(), fcntl.LOCK_EX)

              source = read(source_id)
              target = read(target_id)
              target_document = target.get("course_document") or {}
              source_document = source.get("course_document") or {}
              target_owner = str(target.get("owner_id") or "")
              previous_owner = str(source.get("owner_id") or "")
              if source.get("course_name") != target.get("course_name"):
                  raise SystemExit("course names differ after backup")
              if target_document.get("sections") or target_document.get("blocks"):
                  raise SystemExit("target course changed after backup")
              if target.get("generation_job_id") or target.get("generation_status") != "draft":
                  raise SystemExit("target course changed after backup")
              target_brief = (target.get("generation_request") or {}).get("teacher_course_brief") or {}
              if target_brief.get("lecture_count") != 64 or target_brief.get("total_class_hours") != 128:
                  raise SystemExit("target course inputs changed after backup")
              if not target_owner:
                  raise SystemExit("target owner is missing after backup")
              if (
                  source.get("generation_status") != "teacher_outline_ready"
                  or source.get("outline_generation_status") != "completed"
                  or source.get("teacher_outline_committed") is not True
                  or len(source_document.get("sections") or []) != 12
              ):
                  raise SystemExit("source course changed after backup")

              command_id = f"recover-course-owner-v1:{source_id}:{target_id}"
              existing = next(
                  (
                      item for item in source.get("course_operation_log") or []
                      if item.get("command_id") == command_id
                  ),
                  None,
              )
              changed = previous_owner != target_owner
              if existing and not changed:
                  changed = False
              elif not existing:
                  transferred_at = datetime.now(timezone.utc).isoformat()
                  receipt = {
                      "command_id": command_id,
                      "operation": "recover_course_owner",
                      "source_course_id": source_id,
                      "preserved_target_course_id": target_id,
                      "previous_owner_fingerprint": digest(previous_owner),
                      "owner_fingerprint": digest(target_owner),
                      "document_revision": source_document.get("document_revision"),
                      "transferred_at": transferred_at,
                  }
                  source["course_operation_log"] = [
                      *(source.get("course_operation_log") or []),
                      {
                          "command_id": command_id,
                          "operation": "recover_course_owner",
                          "actor": "production_recovery",
                          "receipt": receipt,
                      },
                  ][-200:]
                  source["course_owner_recovery"] = receipt
                  source["updated_at"] = transferred_at

              source["owner_id"] = target_owner
              request = deepcopy(source.get("generation_request") or {})
              if request:
                  request["_retrieval_actor_id"] = target_owner
                  source["generation_request"] = request
              write_atomic(paths[source_id], source)

          verified = read(source_id)
          if str(verified.get("owner_id") or "") != target_owner:
              raise SystemExit("owner transfer verification failed")
          if verified.get("course_document") != source_document:
              raise SystemExit("course document changed during owner transfer")
          print(json.dumps({
              "changed": changed,
              "source_course_id": source_id,
              "target_course_id": target_id,
              "target_preserved": True,
              "owner_fingerprint": digest(target_owner),
              "document_revision": source_document.get("document_revision"),
              "section_count": len(source_document.get("sections") or []),
          }, sort_keys=True))
          PY

          printf 'backup=%s\n' "$backup_path"
          REMOTE
