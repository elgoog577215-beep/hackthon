name: Production Diagnostics

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Read-only retrieval query to diagnose"
        required: false
        default: "什么是面向对象编程 例子"
        type: string

permissions:
  contents: read

jobs:
  retrieval:
    if: ${{ inputs.query != '__ASSESSMENT_CHAIN__' && inputs.query != '__MODEL_CAPACITY_PROBE__' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure deployment SSH
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          LINGZHI_SSH_KEY: ${{ secrets.LINGZHI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINGZHI_SSH_HOST"
          test -n "$LINGZHI_SSH_USER"
          test -n "$LINGZHI_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LINGZHI_SSH_KEY" > ~/.ssh/lingzhi_deploy
          chmod 600 ~/.ssh/lingzhi_deploy
          ssh-keyscan -H "$LINGZHI_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect retrieval path
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          DIAGNOSTIC_QUERY: ${{ inputs.query }}
        run: |
          set -euo pipefail
          remote_query="$(printf '%q' "$DIAGNOSTIC_QUERY")"
          ssh -i ~/.ssh/lingzhi_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "LINGZHI_DIAGNOSTIC_QUERY=$remote_query bash -s" <<'REMOTE'
          set -euo pipefail
          echo "== service =="
          systemctl is-active lingzhi || true
          docker ps --filter name=lingzhi-searxng --format '{{.Names}} {{.Status}} {{.Ports}}' || true

          echo "== health =="
          curl -fsS --max-time 5 http://127.0.0.1:7862/api/health \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); print(json.dumps(p.get("web_retrieval_v2", p), ensure_ascii=False, indent=2))'

          echo "== searxng direct =="
          curl -fsS --max-time 12 http://127.0.0.1:8080/search \
            --data-urlencode "q=$LINGZHI_DIAGNOSTIC_QUERY" \
            --data 'format=json' \
            --data 'categories=general,science' \
            --data 'language=zh-CN' \
            --data 'safesearch=2' \
            --data 'timeout_limit=4' \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); r=p.get("results") or []; print("result_count", len(r)); print(json.dumps([{"title": x.get("title"), "url": x.get("url"), "content": (x.get("content") or "")[:160]} for x in r[:5]], ensure_ascii=False, indent=2)); r or sys.exit("SearXNG response must contain at least one result")'

          echo "== searxng images direct =="
          curl -fsS --max-time 12 http://127.0.0.1:8080/search \
            --data 'q=human heart anatomy' \
            --data 'format=json' \
            --data 'categories=images' \
            --data 'engines=wikicommons.images' \
            --data 'language=all' \
            --data 'safesearch=2' \
            --data 'timeout_limit=12' \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); r=p.get("results") or []; print("image_result_count", len(r)); print("unresponsive_engines", json.dumps(p.get("unresponsive_engines") or [], ensure_ascii=False)); print(json.dumps([{"title": x.get("title"), "url": x.get("url"), "img_src": x.get("img_src")} for x in r[:5]], ensure_ascii=False, indent=2))'

          echo "== product retrieval matrix: course, assessment, ai_teacher, ppt_image =="
          set -a
          . /opt/lingzhi/state/.env
          set +a
          cd /opt/lingzhi/hackthon/backend
          /opt/lingzhi/.venv/bin/python - <<'PY'
          import asyncio
          import json
          import os

          from retrieval_diagnostics import (
              assert_retrieval_feature,
              run_retrieval_matrix,
          )
          from web_retrieval import configured_retrieval_gateway

          query = os.environ.get("LINGZHI_DIAGNOSTIC_QUERY", "")

          async def main():
              gateway, feature = configured_retrieval_gateway("diagnostic-user")
              assert_retrieval_feature(feature)
              result = await run_retrieval_matrix(gateway, query=query)
              print(json.dumps(result, ensure_ascii=False, indent=2))

          asyncio.run(main())
          PY
          REMOTE

  assessment-chain:
    if: ${{ inputs.query == '__ASSESSMENT_CHAIN__' || inputs.query == '__ASSESSMENT_FAST_DIAGNOSE__' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4

      - name: Configure production SSH
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          ASSESSMENT_DIAGNOSTIC_MODE: ${{ inputs.query }}
          LINGZHI_SSH_KEY: ${{ secrets.LINGZHI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINGZHI_SSH_HOST"
          test -n "$LINGZHI_SSH_USER"
          test -n "$LINGZHI_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LINGZHI_SSH_KEY" > ~/.ssh/lingzhi_deploy
          chmod 600 ~/.ssh/lingzhi_deploy
          ssh-keyscan -H "$LINGZHI_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Run in-memory Unity assessment chain
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          remote_dir="$(ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "mktemp -d /tmp/lingzhi-assessment-diagnostic.XXXXXX")"
          cleanup_remote_dir() {
            case "$remote_dir" in
              /tmp/lingzhi-assessment-diagnostic.*) ;;
              *)
                echo "Refusing to remove unexpected remote path" >&2
                return 1
                ;;
            esac
            ssh \
              -i ~/.ssh/lingzhi_deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
              "rm -rf -- '$remote_dir'" || true
          }
          trap cleanup_remote_dir EXIT

          scp \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            scripts/production_assessment_diagnostic.py \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST:$remote_dir/diagnostic.py"

          ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "LINGZHI_DIAGNOSTIC_DIR='$remote_dir' LINGZHI_DIAGNOSTIC_MODE='$ASSESSMENT_DIAGNOSTIC_MODE' bash -s" <<'REMOTE'
          set -euo pipefail
          set -a
          . /opt/lingzhi/state/.env
          set +a
          test -n "${MODELSCOPE_API_KEY:-}"
          test -n "${MODELSCOPE_MODEL:-}"
          unset AI_API_KEY
          export AI_THINKING_ENABLED=true
          export PYTHONUTF8=1
          export PYTHONPATH=/opt/lingzhi/hackthon/backend
          cd /opt/lingzhi/hackthon/backend

          /opt/lingzhi/.venv/bin/python \
            "$LINGZHI_DIAGNOSTIC_DIR/diagnostic.py" prepare \
            --reference "$LINGZHI_DIAGNOSTIC_DIR/reference.json" \
            --output "$LINGZHI_DIAGNOSTIC_DIR/retrieval.json"

          timeout 900 /opt/lingzhi/.venv/bin/python \
            "$LINGZHI_DIAGNOSTIC_DIR/diagnostic.py" run \
            --profile fast \
            --reference "$LINGZHI_DIAGNOSTIC_DIR/reference.json" \
            --output "$LINGZHI_DIAGNOSTIC_DIR/fast.json"

          if [ "$LINGZHI_DIAGNOSTIC_MODE" = "__ASSESSMENT_CHAIN__" ]; then
            timeout 900 /opt/lingzhi/.venv/bin/python \
              "$LINGZHI_DIAGNOSTIC_DIR/diagnostic.py" run \
              --profile deliberate \
              --reference "$LINGZHI_DIAGNOSTIC_DIR/reference.json" \
              --output "$LINGZHI_DIAGNOSTIC_DIR/deliberate.json"
          fi
          REMOTE

          install -d artifacts/production-assessment-chain
          scp \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST:$remote_dir/*.json" \
            artifacts/production-assessment-chain/

          cleanup_remote_dir
          trap - EXIT

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-assessment-chain-${{ github.run_id }}
          path: artifacts/production-assessment-chain/*.json
          if-no-files-found: error
          retention-days: 7

  model-capacity-probe:
    if: ${{ inputs.query == '__MODEL_CAPACITY_PROBE__' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@v4

      - name: Configure production SSH
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          LINGZHI_SSH_KEY: ${{ secrets.LINGZHI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINGZHI_SSH_HOST"
          test -n "$LINGZHI_SSH_USER"
          test -n "$LINGZHI_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LINGZHI_SSH_KEY" > ~/.ssh/lingzhi_deploy
          chmod 600 ~/.ssh/lingzhi_deploy
          ssh-keyscan -H "$LINGZHI_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Probe production ModelScope candidates
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          remote_dir="$(ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "mktemp -d /tmp/lingzhi-model-capacity-probe.XXXXXX")"
          cleanup_remote_dir() {
            case "$remote_dir" in
              /tmp/lingzhi-model-capacity-probe.*) ;;
              *)
                echo "Refusing to remove unexpected remote path" >&2
                return 1
                ;;
            esac
            ssh \
              -i ~/.ssh/lingzhi_deploy \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
              "rm -rf -- '$remote_dir'" || true
          }
          trap cleanup_remote_dir EXIT

          scp \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            scripts/production_model_capacity_probe.py \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST:$remote_dir/probe.py"

          ssh \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "LINGZHI_DIAGNOSTIC_DIR='$remote_dir' bash -s" <<'REMOTE'
          set -euo pipefail
          set -a
          . /opt/lingzhi/state/.env
          set +a
          test -n "${MODELSCOPE_API_KEY:-}"
          export PYTHONUTF8=1
          export LINGZHI_MODEL_PROBE_OUTPUT="$LINGZHI_DIAGNOSTIC_DIR/model-capacity.json"
          /opt/lingzhi/.venv/bin/python "$LINGZHI_DIAGNOSTIC_DIR/probe.py"
          REMOTE

          install -d artifacts/production-model-capacity
          scp \
            -i ~/.ssh/lingzhi_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST:$remote_dir/model-capacity.json" \
            artifacts/production-model-capacity/

          cleanup_remote_dir
          trap - EXIT

      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-model-capacity-${{ github.run_id }}
          path: artifacts/production-model-capacity/model-capacity.json
          if-no-files-found: error
          retention-days: 7
