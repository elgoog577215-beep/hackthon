name: Production Diagnostics

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Read-only retrieval query to diagnose"
        required: false
        default: "什么是面向对象编程 例子"
        type: string
      probe_ai_model:
        description: "Send one minimal PPT story request and print sanitized routing telemetry"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure deployment SSH
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          LINGZHI_SSH_KEY: ${{ secrets.LINGZHI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINGZHI_SSH_HOST"
          test -n "$LINGZHI_SSH_USER"
          test -n "$LINGZHI_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LINGZHI_SSH_KEY" > ~/.ssh/lingzhi_deploy
          chmod 600 ~/.ssh/lingzhi_deploy
          ssh-keyscan -H "$LINGZHI_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Inspect retrieval path
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          DIAGNOSTIC_QUERY: ${{ inputs.query }}
          PROBE_AI_MODEL: ${{ inputs.probe_ai_model }}
        run: |
          set -euo pipefail
          remote_query="$(printf '%q' "$DIAGNOSTIC_QUERY")"
          remote_probe="$(printf '%q' "$PROBE_AI_MODEL")"
          ssh -i ~/.ssh/lingzhi_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "LINGZHI_DIAGNOSTIC_QUERY=$remote_query LINGZHI_PROBE_AI_MODEL=$remote_probe bash -s" <<'REMOTE'
          set -euo pipefail
          echo "== service =="
          systemctl is-active lingzhi || true
          docker ps --filter name=lingzhi-searxng --format '{{.Names}} {{.Status}} {{.Ports}}' || true

          echo "== health =="
          curl -fsS --max-time 5 http://127.0.0.1:7862/api/health \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); print(json.dumps(p.get("web_retrieval_v2", p), ensure_ascii=False, indent=2))'

          echo "== searxng direct =="
          curl -fsS --max-time 12 http://127.0.0.1:8080/search \
            --data-urlencode "q=$LINGZHI_DIAGNOSTIC_QUERY" \
            --data 'format=json' \
            --data 'categories=general,science' \
            --data 'language=zh-CN' \
            --data 'safesearch=2' \
            --data 'timeout_limit=4' \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); r=p.get("results") or []; print("result_count", len(r)); print(json.dumps([{"title": x.get("title"), "url": x.get("url"), "content": (x.get("content") or "")[:160]} for x in r[:5]], ensure_ascii=False, indent=2)); r or sys.exit("SearXNG response must contain at least one result")'

          echo "== searxng images direct =="
          curl -fsS --max-time 8 http://127.0.0.1:8080/search \
            --data 'q=human heart anatomy' \
            --data 'format=json' \
            --data 'categories=images' \
            --data 'language=all' \
            --data 'safesearch=2' \
            --data 'timeout_limit=7' \
            | python3 -c 'import collections,json,sys; p=json.load(sys.stdin); r=p.get("results") or []; counts=collections.Counter(e for x in r for e in (x.get("engines") or [])); pd=[x for x in r if "public domain image archive" in (x.get("engines") or [])]; print("image_result_count", len(r)); print("image_engine_counts", json.dumps(counts, ensure_ascii=False, sort_keys=True)); print("unresponsive_engines", json.dumps(p.get("unresponsive_engines") or [], ensure_ascii=False)); print("public_domain_results", json.dumps([{"title": x.get("title"), "url": x.get("url"), "img_src": x.get("img_src"), "thumbnail_src": x.get("thumbnail_src"), "engines": x.get("engines")} for x in pd[:5]], ensure_ascii=False, indent=2)); print(json.dumps([{"title": x.get("title"), "url": x.get("url"), "img_src": x.get("img_src"), "engines": x.get("engines")} for x in r[:5]], ensure_ascii=False, indent=2))'

          echo "== product retrieval matrix: course, assessment, ai_teacher, ppt_image =="
          set -a
          . /opt/lingzhi/state/.env
          set +a
          cd /opt/lingzhi/hackthon/backend

          echo "== latest V6 failure structure (no course content) =="
          /opt/lingzhi/.venv/bin/python - <<'PY'
          import collections
          import json
          from pathlib import Path

          from course_presentation_graph import block_artifact_kinds, block_source_text
          from dependencies import get_course_document_repository


          root = Path("/opt/lingzhi/state/backend-data/slide_deck_v6_candidates")
          matches = []
          for path in root.glob("*.json"):
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              if payload.get("failure"):
                  matches.append((str(payload.get("updated_at") or ""), path, payload))
          if not matches:
              print(json.dumps({"found": False}, sort_keys=True))
              raise SystemExit(0)

          _updated_at, candidate_path, candidate = max(matches, key=lambda item: item[0])
          failure = candidate.get("failure") or {}
          checkpoint_path = root / "checkpoints" / candidate_path.name
          checkpoint = {}
          if checkpoint_path.exists():
              checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
          story_payload = candidate.get("story_plan") or checkpoint.get("story_plan") or {}
          pages = story_payload.get("pages") or []
          if not pages:
              pages = [
                  page
                  for batch in (story_payload.get("batches") or checkpoint.get("story_batches") or [])
                  for page in (batch.get("pages") or [])
              ]
          page_id = str(failure.get("page_id") or "")
          page = next((item for item in pages if str(item.get("page_id") or "") == page_id), {})
          visual_payload = candidate.get("visual_plan") or checkpoint.get("visual_plan") or {}
          decisions = visual_payload.get("decisions") or []
          visual = next(
              (item for item in decisions if str(item.get("page_id") or "") == page_id),
              {},
          )
          graph = candidate.get("course_presentation_graph") or checkpoint.get("course_presentation_graph") or {}
          units = graph.get("units") or []
          unit = next(
              (
                  item for item in units
                  if str(item.get("teaching_unit_id") or "")
                  == str(page.get("teaching_unit_id") or "")
              ),
              {},
          )
          source_ids = [str(item) for item in (page.get("source_block_ids") or [])]
          graph_kinds = unit.get("primary_block_kinds") or {}
          graph_roles = unit.get("primary_block_roles") or {}
          graph_artifacts = unit.get("primary_block_artifacts") or {}
          graph_texts = unit.get("primary_block_texts") or {}
          graph_kind_counts = collections.Counter(
              str(graph_kinds.get(block_id) or "unknown")
              for block_id in source_ids
          )
          document, canonical = get_course_document_repository().load_document(
              str(candidate.get("course_id") or "")
          )
          actual_blocks = {
              block.block_id: block
              for block in document.blocks
              if block.status == "final"
          }
          actual_kind_counts = collections.Counter(
              str(actual_blocks[block_id].kind if block_id in actual_blocks else "missing")
              for block_id in source_ids
          )
          source_shapes = [
              {
                  "graph_kind": str(graph_kinds.get(block_id) or ""),
                  "graph_role": str(graph_roles.get(block_id) or ""),
                  "graph_artifacts": sorted(str(item) for item in graph_artifacts.get(block_id) or []),
                  "graph_text_chars": len(str(graph_texts.get(block_id) or "")),
                  "actual_present": block_id in actual_blocks,
                  "actual_kind": str(actual_blocks[block_id].kind if block_id in actual_blocks else ""),
                  "actual_payload_keys": (
                      sorted(str(key) for key in (actual_blocks[block_id].payload or {}))
                      if block_id in actual_blocks else []
                  ),
                  "actual_artifacts": (
                      sorted(block_artifact_kinds(actual_blocks[block_id]))
                      if block_id in actual_blocks else []
                  ),
                  "actual_text_chars": (
                      len(block_source_text(actual_blocks[block_id]))
                      if block_id in actual_blocks else 0
                  ),
              }
              for block_id in source_ids
          ]
          print(json.dumps({
              "found": True,
              "updated_at": candidate.get("updated_at"),
              "failure_stage": failure.get("stage"),
              "failure_code": failure.get("code"),
              "failure_message": failure.get("message"),
              "failure_page_id": page_id,
              "failure_batch_id": failure.get("batch_id"),
              "checkpoint_contract": checkpoint.get("build_contract_version"),
              "story_page_count": len(pages),
              "failure_page_present": bool(page),
              "story_layout_slug": str(page.get("template_layout_id") or "").rsplit("/", 1)[-1],
              "source_block_count": len(source_ids),
              "course_document_canonical": bool(canonical),
              "course_revision_matches_graph": (
                  str(document.document_revision or "")
                  == str(graph.get("source_document_revision") or "")
              ),
              "graph_kind_counts": dict(sorted(graph_kind_counts.items())),
              "actual_kind_counts": dict(sorted(actual_kind_counts.items())),
              "source_shapes": source_shapes,
              "visual_decision": visual.get("decision"),
              "visual_layout_slug": str(visual.get("resolved_template_layout_id") or "").rsplit("/", 1)[-1],
              "visual_degraded": bool(visual.get("degraded")),
              "visual_reason": visual.get("degradation_reason"),
          }, ensure_ascii=False, sort_keys=True))
          PY

          echo "== latest V6 story underfill structure (no course content) =="
          /opt/lingzhi/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          from course_presentation_graph import CoursePresentationGraphV1
          from slide_deck_v6 import (
              SlideStoryPlanV3,
              _presentation_summary_text,
              _unit_source_text_for_blocks,
              prepare_story_plan_for_final_compilation,
              validate_slide_story_plan_v3,
          )
          from template_layout_contract import compile_builtin_template_layout_contract_v1


          root = Path("/opt/lingzhi/state/backend-data/slide_deck_v6_candidates")
          matches = []
          for path in root.glob("*.json"):
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  continue
              failure = payload.get("failure") or {}
              if failure.get("code") == "story_page_underfilled":
                  matches.append((str(payload.get("updated_at") or ""), path, payload))
          if not matches:
              print(json.dumps({"found": False}, sort_keys=True))
              raise SystemExit(0)

          _updated_at, candidate_path, candidate = max(matches, key=lambda item: item[0])
          failure = candidate.get("failure") or {}
          checkpoint_path = root / "checkpoints" / candidate_path.name
          checkpoint = json.loads(checkpoint_path.read_text(encoding="utf-8"))
          graph = CoursePresentationGraphV1.model_validate(
              candidate.get("course_presentation_graph")
              or checkpoint["course_presentation_graph"]
          )
          story_payload = candidate.get("story_plan") or checkpoint.get("story_plan")
          if story_payload is None:
              story_payload = {
                  "schema_version": "slide_story_plan_v3",
                  "source_document_revision": graph.source_document_revision,
                  "template_digest": str(checkpoint.get("template_digest") or ""),
                  "batches": checkpoint.get("story_batches") or [],
              }
          story = SlideStoryPlanV3.model_validate(story_payload)
          template = compile_builtin_template_layout_contract_v1(
              str(checkpoint.get("theme") or "qizhi-classroom")
          )
          before_error = ""
          validated_page_id = ""
          try:
              validate_slide_story_plan_v3(story, graph, template)
          except Exception as error:
              before_error = getattr(getattr(error, "failure", None), "code", type(error).__name__)
              validated_page_id = str(
                  getattr(getattr(error, "failure", None), "page_id", "") or ""
              )
          candidate_page_id = str(failure.get("page_id") or "")
          page_id = validated_page_id or candidate_page_id
          page = next((item for item in story.pages if item.page_id == page_id), None)
          if page is None:
              print(json.dumps({
                  "found": True,
                  "updated_at": candidate.get("updated_at"),
                  "failure_stage": failure.get("stage"),
                  "failure_code": failure.get("code"),
                  "checkpoint_contract": checkpoint.get("build_contract_version"),
                  "checkpoint_story_pages": len(story.pages),
                  "candidate_failure_page_present": any(
                      item.page_id == candidate_page_id for item in story.pages
                  ),
                  "validation_before_prepare": before_error or "passed",
                  "validated_failure_page_present": any(
                      item.page_id == validated_page_id for item in story.pages
                  ),
              }, ensure_ascii=False, sort_keys=True))
              raise SystemExit(0)
          unit = next(
              item for item in graph.units
              if item.teaching_unit_id == page.teaching_unit_id
          )
          layout = template.get_layout(page.template_layout_id)
          body_slots = [slot for slot in layout.slots if slot.slot_kind == "body"]
          summary_text = _presentation_summary_text(page.summary)
          source_text = _presentation_summary_text(
              _unit_source_text_for_blocks(unit, page.source_block_ids)
          )
          visual_payload = checkpoint.get("visual_plan") or candidate.get("visual_plan") or {}
          visual = next(
              (
                  item for item in visual_payload.get("decisions") or []
                  if str(item.get("page_id") or "") == page_id
              ),
              {},
          )
          prepared = prepare_story_plan_for_final_compilation(story, graph, template)
          prepared_page = next(item for item in prepared.pages if item.page_id == page_id)
          after_error = ""
          try:
              validate_slide_story_plan_v3(prepared, graph, template)
          except Exception as error:
              after_error = getattr(getattr(error, "failure", None), "code", type(error).__name__)
          print(json.dumps({
              "found": True,
              "updated_at": candidate.get("updated_at"),
              "failure_stage": failure.get("stage"),
              "failure_code": failure.get("code"),
              "checkpoint_contract": checkpoint.get("build_contract_version"),
              "layout_slug": layout.layout_slug,
              "body_slot_count": len(body_slots),
              "body_min_chars": body_slots[0].min_chars if len(body_slots) == 1 else 0,
              "body_max_chars": body_slots[0].max_chars if len(body_slots) == 1 else 0,
              "summary_chars": len(summary_text),
              "source_chars": len(source_text),
              "validation_before_prepare": before_error or "passed",
              "prepared_summary_chars": len(_presentation_summary_text(prepared_page.summary)),
              "validation_after_prepare": after_error or "passed",
              "visual_decision": visual.get("decision"),
              "visual_layout_slug": str(visual.get("resolved_template_layout_id") or "").rsplit("/", 1)[-1],
              "visual_degraded": bool(visual.get("degraded")),
              "visual_reason": visual.get("degradation_reason"),
          }, ensure_ascii=False, sort_keys=True))
          PY

          if [ "$LINGZHI_PROBE_AI_MODEL" = "true" ]; then
            /opt/lingzhi/.venv/bin/python - <<'PY'
          import asyncio
          import json

          from ai_base import AIBase
          from ai_provider_route import provider_route_snapshot


          async def probe_ai_model(
              *,
              model_role: str,
              use_fast_model: bool,
          ) -> None:
              provider = AIBase(provider_profile="ppt")
              telemetry = []
              status = "failed"
              error_code = ""
              try:
                  response = await provider._call_llm(
                      json.dumps({"probe": model_role}),
                      system_prompt='Return only this JSON object: {"ok":true}',
                      use_fast_model=use_fast_model,
                      enable_thinking=False,
                      retry_count=1,
                      max_attempts=3,
                      max_tokens=64,
                      reject_truncated=True,
                      raise_on_failure=True,
                      json_mode=True,
                      model_role=model_role,
                      telemetry_sink=telemetry.append,
                  )
                  parsed = provider._extract_json(response or "") or {}
                  status = "completed" if parsed.get("ok") is True else "invalid_json"
              except Exception as error:
                  error_code = type(error).__name__

              attempts = [
                  {
                      "model_id": str(item.get("model_id") or ""),
                      "provider_route": str(item.get("provider_route") or "primary"),
                      "status": str(item.get("status") or "unknown"),
                      "error_code": str(item.get("error_code") or ""),
                      "duration_ms": int(item.get("duration_ms") or 0),
                  }
                  for item in telemetry
                  if isinstance(item, dict)
              ]
              print(f"{model_role}_model_probe", json.dumps({
                  "status": status,
                  "error_code": error_code,
                  "attempts": attempts,
                  "provider_route": provider_route_snapshot(),
              }, ensure_ascii=False, sort_keys=True))
              if status != "completed":
                  raise SystemExit(1)


          asyncio.run(probe_ai_model(
              model_role="ppt_story",
              use_fast_model=False,
          ))
          asyncio.run(probe_ai_model(
              model_role="ppt_visual",
              use_fast_model=True,
          ))
          PY
          fi

          /opt/lingzhi/.venv/bin/python - <<'PY'
          import asyncio
          import json
          import os
          import tempfile

          import requests

          from retrieval_diagnostics import (
              assert_retrieval_feature,
              run_retrieval_matrix,
          )
          from slide_web_images import (
              download_retrieved_image_v5,
              hydrate_shared_image_candidates_v5,
              search_shared_web_images_v5,
          )
          from web_retrieval import configured_retrieval_gateway

          query = os.environ.get("LINGZHI_DIAGNOSTIC_QUERY", "")

          async def main():
              gateway, feature = configured_retrieval_gateway("diagnostic-user")
              assert_retrieval_feature(feature)
              result = await run_retrieval_matrix(gateway, query=query)
              print(json.dumps(result, ensure_ascii=False, indent=2))

          asyncio.run(main())

          gateway, _ = configured_retrieval_gateway("diagnostic-ppt-user")
          package = search_shared_web_images_v5(
              ["human heart anatomy"],
              gateway=gateway,
          )
          with requests.Session() as client:
              candidates = hydrate_shared_image_candidates_v5(package, client=client)
              errors = []
              with tempfile.TemporaryDirectory(prefix="lingzhi-ppt-smoke-") as output_dir:
                  downloaded = None
                  selected = None
                  for candidate in candidates:
                      try:
                          downloaded = download_retrieved_image_v5(
                              candidate,
                              client=client,
                              output_dir=output_dir,
                          )
                          selected = candidate
                          break
                      except Exception as exc:
                          errors.append(type(exc).__name__)
                  if downloaded is None or selected is None:
                      raise RuntimeError(
                          "PPT public-domain asset download failed: " + ",".join(errors)
                      )
                  print("ppt_public_domain_asset", json.dumps({
                      "source_page_url": selected.source_page_url,
                      "license": selected.license,
                      "bytes": downloaded.stat().st_size,
                  }, ensure_ascii=False))
          PY
          REMOTE
