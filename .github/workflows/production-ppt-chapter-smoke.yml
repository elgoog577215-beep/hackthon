name: Replay two PPT lessons with unpublished feature branch

on:
  workflow_dispatch:
    inputs:
      course_id:
        description: "Optional production course ID; blank selects a published programming course"
        required: false
        default: ""
        type: string
      chapter_id:
        description: "Optional chapter root ID; blank selects the strongest code-backed chapter"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: lingzhi-production
  cancel-in-progress: false

jobs:
  chapter-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout unpublished PPT feature
        uses: actions/checkout@v4
        with:
          ref: fix/ppt-layout-capability-binding
          path: feature

      - name: Configure production SSH
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          LINGZHI_SSH_KEY: ${{ secrets.LINGZHI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINGZHI_SSH_HOST"
          test -n "$LINGZHI_SSH_USER"
          test -n "$LINGZHI_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LINGZHI_SSH_KEY" > ~/.ssh/lingzhi_deploy
          chmod 600 ~/.ssh/lingzhi_deploy
          ssh-keyscan -H "$LINGZHI_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload unpublished backend to isolated server directory
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          test_root="/tmp/lingzhi-ppt-source-test-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/lingzhi_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "mkdir -p '$test_root'"
          tar --exclude='backend/data' --exclude='*/__pycache__' -C feature/apps/lingzhi -czf - backend shared \
            | ssh -i ~/.ssh/lingzhi_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
              "tar -xzf - -C '$test_root'"

      - name: Replay production checkpoints in memory without writes
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          test_root="/tmp/lingzhi-ppt-source-test-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/lingzhi_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=30 \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "set -a; . /opt/lingzhi/state/.env; set +a; export PYTHONDONTWRITEBYTECODE=1; export PYTHONPATH='$test_root:$test_root/backend'; cd '$test_root/backend'; /opt/lingzhi/.venv/bin/python -" \
            < apps/lingzhi/scripts/replay_two_lesson_ppt_with_feature.py

      - name: Remove isolated feature directory
        if: always()
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          test_root="/tmp/lingzhi-ppt-source-test-${GITHUB_RUN_ID}"
          case "$test_root" in /tmp/lingzhi-ppt-source-test-[0-9]*) ;; *) exit 1 ;; esac
          ssh -i ~/.ssh/lingzhi_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            "rm -rf -- '$test_root'"
