name: Verify approved lecture six PPT recovery

on:
  workflow_dispatch:
    inputs:
      course_id:
        description: "Optional production course ID; blank selects a published programming course"
        required: false
        default: ""
        type: string
      chapter_id:
        description: "Optional chapter root ID; blank selects the strongest code-backed chapter"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: lingzhi-production
  cancel-in-progress: false

jobs:
  chapter-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure production SSH
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
          LINGZHI_SSH_KEY: ${{ secrets.LINGZHI_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$LINGZHI_SSH_HOST"
          test -n "$LINGZHI_SSH_USER"
          test -n "$LINGZHI_SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LINGZHI_SSH_KEY" > ~/.ssh/lingzhi_deploy
          chmod 600 ~/.ssh/lingzhi_deploy
          ssh-keyscan -H "$LINGZHI_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Verify lecture six preview and PPTX export
        env:
          LINGZHI_SSH_HOST: ${{ secrets.LINGZHI_SSH_HOST }}
          LINGZHI_SSH_USER: ${{ secrets.LINGZHI_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lingzhi_deploy -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$LINGZHI_SSH_USER@$LINGZHI_SSH_HOST" \
            '/opt/lingzhi/.venv/bin/python -' < apps/lingzhi/scripts/verify_live_l1_6_export.py
