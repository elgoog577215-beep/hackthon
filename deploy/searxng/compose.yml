services:
  searxng:
    image: ghcr.io/searxng/searxng@sha256:f4c8e59de166ed71f6380c0847c312ca51f0d41996e31d0559163b6b09ecde52
    container_name: lingzhi-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FORCE_OWNERSHIP: "false"
      SEARXNG_BIND_ADDRESS: "0.0.0.0"
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?SEARXNG_SECRET must be set}"
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      SEARXNG_IMAGE_PROXY: "false"
    volumes:
      - /opt/lingzhi/state/searxng/config:/etc/searxng:ro
      - /opt/lingzhi/state/searxng/cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
